name: Provider smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * 1-5"

permissions:
  contents: read

concurrency:
  group: provider-smoke
  cancel-in-progress: false

jobs:
  provider:
    name: Live ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: yahoo-mcp
            test: tests/integration/test_tool_calls_e2e.py::test_call_tool_returns_real_data_through_the_full_stack
          - provider: sec
            test: tests/live/test_sec_live.py::test_live_get_sec_recent_filings
          - provider: fred
            test: tests/live/test_macroeconomics_live.py::test_get_macroeconomic_series_live
          - provider: wsj
            test: tests/live/test_stock_live.py::test_get_wsj_stock_history_live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.2
      - run: uv sync --locked --group test --python 3.13
      - name: Exercise live provider
        env:
          TEST_NODE: ${{ matrix.test }}
        run: uv run --frozen --no-sync pytest -m live -o addopts="" "$TEST_NODE" --junitxml=provider.xml
      - name: Require a successful provider response
        run: |
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('provider.xml').findall('.//testcase')
          assert cases, 'No provider checks ran'
          assert all(case.find('skipped') is None for case in cases), 'Provider was unavailable; see test report'
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: provider-${{ matrix.provider }}
          path: provider.xml
          retention-days: 14
